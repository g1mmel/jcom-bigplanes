name: Preserve exact C130 r0003 systems outputs
on:
  push:
    branches: [claude-design/c130-systems-r0003-20261029]
    paths: [family/claude-design/r0003/.delivery/transfer.json]
permissions:
  contents: write
concurrency:
  group: c130-r0003-exact-preservation
  cancel-in-progress: false
jobs:
  restore-reviewed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: family/claude-design/r0003
      - name: Restore and verify exact reviewed bytes
        run: python family/claude-design/r0003/source/restore_delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: claude-design-c130-r0003-reviewed-outputs
          path: |
            family/claude-design/r0003/
            family/claude-design/packages/C130-family-r0003.tar.xz
          if-no-files-found: error
          retention-days: 14
      - name: Commit restored files without rebuilding models
        env:
          REVIEW_BRANCH: claude-design/c130-systems-r0003-20261029
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A family/claude-design/r0003 family/claude-design/packages/C130-family-r0003.tar.xz
          git commit -m 'claude-design: preserve exact reviewed C130 r0003 systems, binaries and evidence'
          for attempt in 1 2 3; do
            git fetch origin "$REVIEW_BRANCH"
            git rebase "origin/$REVIEW_BRANCH"
            python family/claude-design/r0003/source/restore_delivery.py --verify-only
            if git push origin "HEAD:$REVIEW_BRANCH"; then exit 0; fi
          done
          echo 'Non-forced preservation push failed after three attempts.' >&2
          exit 1
