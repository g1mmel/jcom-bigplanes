name: Build unified C130 family candidates
on:
  push:
    branches:
      - cg11/c130-shared-airframe-20261027
    paths:
      - 'tools/build_c130_family.py'
      - 'tools/validate_c130_family.py'
      - 'tools/render_c130_family.py'
      - '.github/workflows/c130-family-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate candidate GLBs from preserved original
        run: python3 tools/build_c130_family.py
      - name: Validate shared airframe and variant kits
        run: python3 tools/validate_c130_family.py
      - name: Install software preview renderer
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Render side front top and hero review previews
        run: python3 tools/render_c130_family.py
      - name: Commit immutable candidate files to this review branch
        run: |
          git config user.name "cg11 C130 Builder"
          git config user.email "cg11@users.noreply.github.com"
          git add family/r0001/
          if ! git diff --cached --quiet; then
            git commit -m "cg11: generated common C130 r0001 review GLBs"
            git fetch origin cg11/c130-shared-airframe-20261027
            git rebase origin/cg11/c130-shared-airframe-20261027
            git push origin HEAD:cg11/c130-shared-airframe-20261027
          fi
      - name: Retain candidate files and manifest
        uses: actions/upload-artifact@v4
        with:
          name: c130-shared-airframe-r0001-DRAFT
          path: family/r0001/
          if-no-files-found: error
